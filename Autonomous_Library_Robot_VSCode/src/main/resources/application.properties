spring.application.name=autonomous-library-robot
server.port=8081

# MySQL connection. Set DB_PASSWORD in your terminal or edit the value below.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autonomous_library_robot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Helpful during development; do not enable SQL logging in production.
